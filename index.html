<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda de Servicios Inteligente</title>
    
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <style>
        /* 1. LAYOUT DE PANTALLA COMPLETA */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column; 
        }
        
        /* 2. CABECERA */
        .header { 
            flex-shrink: 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: white; 
            padding: 10px 15px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            z-index: 20; /* Mayor que el mapa */
        }
        h1 { margin: 0; font-size: 1.2rem; color: #2c3e50; }
        
        /* 3. CONTENEDOR DEL CALENDARIO */
        #calendar-container { 
            flex-grow: 1; 
            background: white; 
            padding: 10px; 
            overflow: hidden; 
            position: relative;
        }

        /* Botones Generales */
        .login-btn { background: #007bff; color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; border: none; font-size: 0.9rem; }
        .logout-btn { background: #6c757d; display: none; padding: 5px 10px; border-radius: 5px; color: white; border: none;}
        #admin-status { font-weight: bold; color: #28a745; display: none; margin-right: 10px; font-size: 0.8rem; }

        /* Modales */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(2px); }
        .modal-content { background-color: white; margin: 5% auto; padding: 20px; width: 90%; max-width: 350px; border-radius: 12px; position: relative; max-height: 90vh; overflow-y: auto;}
        .close-x { float: right; font-size: 20px; cursor: pointer; }
        
        /* Inputs y Formularios */
        .form-group { margin-bottom: 15px; position: relative; } /* Relative para el autocompletado */
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
        
        .btn-save { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; margin-top: 5px; font-weight: bold;}
        .btn-delete { background: #dc3545; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; margin-top: 15px; font-weight: bold;}
        
        /* NOTA: Se eliminó el estilo .btn-map que ya no se usa */

        /* --- ESTILOS DEL AUTOCOMPLETADO (Buscador) --- */
        .suggestions-list {
            position: absolute;
            background: white;
            border: 1px solid #ddd;
            border-top: none;
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
            z-index: 1001;
            list-style: none;
            padding: 0;
            margin: 0;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: none; /* Oculto por defecto */
        }
        .suggestion-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }
        .suggestion-item:hover { background-color: #f0f2f5; }

        /* 4. COMPRESIÓN VISTA AÑO */
        .fc-multimonth-header { padding: 2px 0 !important; font-size: 0.9em; background: #f8f9fa; }
        .fc-multimonth-daygrid-table { font-size: 0.75em; }
        .fc-daygrid-day-frame { min-height: auto !important; }
        .fc-daygrid-day-top { flex-direction: row; } 
        .fc-multimonth-month { padding: 0 5px 5px 5px !important; }

        /* --- 5. CORRECCIÓN AGENDA (QUITA PUNTOS Y HORA) --- */
        .fc-list-event-graphic { display: none !important; }
        .fc-list-event-time { display: none !important; }
        .fc-list-event-title { padding-left: 0 !important; cursor: pointer; }

        /* Ajustes Móvil */
        @media (max-width: 768px) {
            h1 { font-size: 1rem; }
            .header { padding: 5px 10px; }
            .fc-header-toolbar { margin-bottom: 5px !important; }
            .fc-toolbar-title { font-size: 1.1rem !important; }
            .fc-button { padding: 4px 8px !important; font-size: 0.8em !important; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>📅 Agenda Geo-Localizada</h1>
        <div>
            <span id="admin-status">🟢 Admin</span>
            <button id="btnLogin" class="login-btn" onclick="iniciarSesion()">🔒 Entrar</button>
            <button id="btnLogout" class="login-btn logout-btn" onclick="cerrarSesion()">Salir</button>
        </div>
    </div>

    <div id="calendar-container">
        <div id='calendar'></div>
    </div>

    <div id="reservaModal" class="modal">
        <div class="modal-content">
            <span class="close-x" onclick="cerrarModal('reservaModal')">×</span>
            <h2 style="margin-top:0;">Nueva Reserva</h2>
            
            <div class="form-group">
                <label>Desde:</label>
                <input type="date" id="fechaInicio">
            </div>
            <div class="form-group">
                <label>Hasta:</label>
                <input type="date" id="fechaFin">
            </div>
            
            <div class="form-group">
                <label>Buscar Ciudad:</label>
                <input type="text" id="ciudadInput" placeholder="Escribe ciudad (ej. Monterrey)..." autocomplete="off">
                <ul id="listaSugerencias" class="suggestions-list"></ul>
            </div>

            <div class="form-group">
                <label>Cliente:</label>
                <input type="text" id="nombreInput" placeholder="Nombre completo">
            </div>

            <button onclick="guardarReserva()" class="btn-save">💾 Guardar Reserva</button>
        </div>
    </div>

    <div id="detalleModal" class="modal">
        <div class="modal-content">
            <span class="close-x" onclick="cerrarModal('detalleModal')">×</span>
            <h2 style="margin-top:0;">Detalles</h2>
            
            <p><strong>Cliente:</strong> <span id="detCliente"></span></p>
            <p><strong>Ciudad:</strong> <span id="detCiudad"></span></p>
            <p><strong>Fechas:</strong> <span id="detFechas"></span></p>
            
            <button id="btnEliminar" class="btn-delete" style="display:none;" onclick="borrarReserva()">🗑️ Eliminar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyCN7AD2GO_Ks4tcMxLMkG6jODKUaTPwlIk",
          authDomain: "agendaservicios.firebaseapp.com",
          projectId: "agendaservicios",
          storageBucket: "agendaservicios.firebasestorage.app",
          messagingSenderId: "1068275517204",
          appId: "1:1068275517204:web:9bdd41c8233bc1fda06401"
        };
        // -------------------------------------------------------

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        let calendar;
        let esAdmin = false;
        let eventoSeleccionadoID = null;
        const CONTRASEÑA_ADMIN = "servicio2024"; 

        // --- CONFIGURACIÓN DEL BUSCADOR DE CIUDADES (RESTRICTIVO) ---
        const inputCiudad = document.getElementById('ciudadInput');
        const listaSugerencias = document.getElementById('listaSugerencias');
        let timeoutBuscador = null;

        inputCiudad.addEventListener('input', function() {
            const texto = this.value;
            listaSugerencias.innerHTML = ''; 
            listaSugerencias.style.display = 'none';

            if (texto.length < 3) return; 

            clearTimeout(timeoutBuscador);
            timeoutBuscador = setTimeout(async () => {
                try {
                    // Mantenemos countrycodes=mx para limitar a México
                    const respuesta = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${texto}&limit=8&accept-language=es&countrycodes=mx&addressdetails=1`);
                    const resultados = await respuesta.json();

                    if (resultados.length > 0) {
                        
                        // FILTRADO ESTRICTO: Solo Ciudades / Localidades
                        const resultadosFiltrados = resultados.filter(lugar => {
                            return lugar.class === 'place' || lugar.class === 'boundary';
                        });

                        if(resultadosFiltrados.length > 0) {
                            listaSugerencias.style.display = 'block';
                            
                            resultadosFiltrados.forEach(lugar => {
                                const item = document.createElement('li');
                                item.className = 'suggestion-item';
                                
                                // Usamos icono de ciudad siempre
                                let icono = '🏙️'; 

                                let nombrePrincipal = lugar.name || texto; 
                                
                                item.innerHTML = `<strong>${icono} ${nombrePrincipal}</strong><br><small style="color:#666;">${lugar.display_name}</small>`;
                                
                                item.onclick = function() {
                                    inputCiudad.value = nombrePrincipal; 
                                    inputCiudad.dataset.ubicacionCompleta = lugar.display_name;
                                    listaSugerencias.style.display = 'none'; 
                                };
                                listaSugerencias.appendChild(item);
                            });
                        }
                    }
                } catch (e) {
                    console.error("Error buscando:", e);
                }
            }, 300); 
        });

        // Ocultar lista si clic fuera
        document.addEventListener('click', function(e) {
            if (e.target !== inputCiudad) {
                listaSugerencias.style.display = 'none';
            }
        });
        // ---------------------------------------------------

        document.addEventListener('DOMContentLoaded', async function() {
            var calendarEl = document.getElementById('calendar');
            const esMovil = window.innerWidth < 768;

            calendar = new FullCalendar.Calendar(calendarEl, {
                height: '100%',
                initialView: 'dayGridMonth',
                locale: 'es',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,multiMonthYear,listYear' 
                },
                views: {
                    dayGridMonth: { buttonText: 'Mes' },
                    multiMonthYear: { 
                        buttonText: 'Año',
                        multiMonthMaxColumns: esMovil ? 2 : 4, 
                    },
                    listYear: { 
                        buttonText: 'Agenda',
                        noEventsText: 'No hay reservas'
                    }
                },
                dateClick: function(info) {
                    if (esAdmin) abrirModalCrear(info.dateStr);
                },
                eventClick: function(info) {
                    mostrarDetalles(info.event);
                }
            });

            await cargarReservas();
            calendar.render();
        });

        async function cargarReservas() {
            try {
                const q = query(collection(db, "reservas"));
                const querySnapshot = await getDocs(q);
                calendar.removeAllEvents();

                querySnapshot.forEach((documento) => {
                    const data = documento.data();
                    if (!data.fechaInicio && !data.fecha) return; 
                    
                    let inicio = data.fechaInicio || data.fecha; 
                    let fin = data.fechaFin || data.fecha;
                    let fechaFinVisual = new Date(fin + 'T00:00:00');
                    if (isNaN(fechaFinVisual.getTime())) return;

                    fechaFinVisual.setDate(fechaFinVisual.getDate() + 1);
                    let fechaFinFormateada = fechaFinVisual.toISOString().split('T')[0];
                    
                    let ciudadCorta = data.ciudad.split(",")[0]; 

                    calendar.addEvent({
                        id: documento.id,
                        title: '📍 ' + ciudadCorta + ' - ' + data.cliente,
                        start: inicio,
                        end: fechaFinFormateada, 
                        allDay: true,
                        backgroundColor: '#FF5733',
                        borderColor: '#FF5733',
                        extendedProps: {
                            cliente: data.cliente,
                            fechaFinReal: fin,
                            ciudadCompleta: data.ciudad 
                        }
                    });
                });
            } catch (error) { console.error(error); }
        }

        window.guardarReserva = async function() {
            const fechaInicioStr = document.getElementById('fechaInicio').value;
            const fechaFinStr = document.getElementById('fechaFin').value;
            const ciudad = document.getElementById('ciudadInput').value;
            const nombre = document.getElementById('nombreInput').value;

            if(ciudad === "" || nombre === "" || fechaInicioStr === "" || fechaFinStr === "") {
                alert("⚠️ Llena todos los campos"); return;
            }
            if(fechaFinStr < fechaInicioStr) {
                alert("⛔ Fecha fin incorrecta"); return;
            }

            const nuevaInicio = new Date(fechaInicioStr + 'T00:00:00');
            const nuevaFin = new Date(fechaFinStr + 'T00:00:00');
            const eventos = calendar.getEvents();
            let hayConflicto = false;

            for (const ev of eventos) {
                const evInicio = ev.start; 
                const evFin = ev.end; 
                const nuevaFinComp = new Date(nuevaFin);
                nuevaFinComp.setDate(nuevaFinComp.getDate() + 1);

                if (nuevaInicio < evFin && nuevaFinComp > evInicio) {
                    hayConflicto = true; break;
                }
            }

            if (hayConflicto) {
                alert("⛔ ¡FECHAS YA OCUPADAS!"); return;
            }

            try {
                await addDoc(collection(db, "reservas"), {
                    fechaInicio: fechaInicioStr,
                    fechaFin: fechaFinStr,
                    ciudad: ciudad,
                    cliente: nombre,
                    creado: new Date()
                });
                await cargarReservas();
                alert("✅ Guardado");
                cerrarModal('reservaModal');
            } catch (e) { console.error(e); alert("Error al guardar"); }
        }

        window.borrarReserva = async function() {
            if(!eventoSeleccionadoID) return;
            if(confirm("¿Eliminar reserva?")) {
                try {
                    await deleteDoc(doc(db, "reservas", eventoSeleccionadoID));
                    const evento = calendar.getEventById(eventoSeleccionadoID);
                    if(evento) evento.remove();
                    alert("🗑️ Eliminada");
                    cerrarModal('detalleModal');
                } catch (e) { alert("Error borrando"); }
            }
        }

        window.abrirModalCrear = function(fecha) {
            document.getElementById('fechaInicio').value = fecha;
            document.getElementById('fechaFin').value = fecha;
            document.getElementById('ciudadInput').value = ""; 
            document.getElementById('nombreInput').value = "";
            document.getElementById('listaSugerencias').style.display = 'none';
            document.getElementById('reservaModal').style.display = "block";
        }

        window.mostrarDetalles = function(evento) {
            eventoSeleccionadoID = evento.id; 
            
            const ciudadCompleta = evento.extendedProps.ciudadCompleta || evento.title.replace('📍 ','');

            document.getElementById('detCiudad').innerText = ciudadCompleta;
            document.getElementById('detCliente').innerText = evento.extendedProps.cliente || "No especificado";
            
            const inicio = evento.start.toISOString().split('T')[0];
            const fin = evento.extendedProps.fechaFinReal;
            document.getElementById('detFechas').innerText = `${inicio} al ${fin}`;

            // SE ELIMINÓ LA LÓGICA DEL LINK DE MAPAS AQUÍ
            
            const btnEliminar = document.getElementById('btnEliminar');
            btnEliminar.style.display = esAdmin ? 'block' : 'none';

            document.getElementById('detalleModal').style.display = "block";
        }

        window.cerrarModal = function(idModal) {
            document.getElementById(idModal).style.display = "none";
        }

        window.iniciarSesion = function() {
            const pass = prompt("Contraseña Admin:");
            if (pass === CONTRASEÑA_ADMIN) {
                esAdmin = true;
                document.getElementById('btnLogin').style.display = 'none';
                document.getElementById('btnLogout').style.display = 'inline-block';
                document.getElementById('admin-status').style.display = 'inline';
                alert("✅ Admin Activo");
            } else { alert("❌ Incorrecto"); }
        }

        window.cerrarSesion = function() {
            esAdmin = false;
            document.getElementById('btnLogin').style.display = 'inline-block';
            document.getElementById('btnLogout').style.display = 'none';
            document.getElementById('admin-status').style.display = 'none';
        }
    </script>
</body>
</html>
